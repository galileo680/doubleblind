[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doubleblind-agent"
version = "0.1.0"
description = "DoubleBlind party runtime: private system model, negotiator, coder, triage and egress guard"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "doubleblind-contract",
  "doubleblind-llm",
  "doubleblind-sandbox",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["doubleblind_agent"]
