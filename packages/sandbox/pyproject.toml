[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doubleblind-sandbox"
version = "0.1.0"
description = "DoubleBlind sandbox providers: Nebius Token Factory Sandboxes, Docker and local directories"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "doubleblind-llm",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["doubleblind_sandbox"]
