[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doubleblind-contract"
version = "0.1.0"
description = "DoubleBlind Contract Spec, validator and contract test runner"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.8",
  "ruamel.yaml>=0.18",
  "jsonschema>=4.23",
  "jsonpath-ng>=1.6",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13.8",
]

[tool.hatch.build.targets.wheel]
packages = ["doubleblind_contract"]
