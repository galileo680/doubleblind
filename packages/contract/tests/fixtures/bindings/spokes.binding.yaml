doubleblind_binding: "1.0"
side: consumer
base_url: "${CONSUMER_BASE_URL}"
webhook_receiver_url: "${CONSUMER_BASE_URL}/integrations/parcelly/webhook"
app:
  manage: true
  start: "uvicorn app.main:app --host 127.0.0.1 --port 8000"
  cwd: "."
  env:
    PARCELLY_BASE_URL: "{{stub.url}}"
    PARCELLY_API_KEY: "{{secrets.partner_api_key}}"
    PARCELLY_WEBHOOK_SECRET: "{{secrets.webhook_secret}}"
    SPOKES_DATABASE_URL: "sqlite://"
    DOUBLEBLIND_TEST_HOOKS: "1"
  healthcheck: { method: GET, path: /health }
actions:
  reset: { method: POST, path: /__doubleblind/reset }
  create_order:
    method: POST
    path: /__doubleblind/orders
    body: "{{args}}"
    capture: { order_id: "$.id" }
  pay_order: { method: POST, path: "/orders/{{ctx.order_id}}/pay" }
queries:
  order: { method: GET, path: "/orders/{{ctx.order_id}}" }
