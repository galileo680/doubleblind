name: spokes-parcelly
contract_id: spokes-parcelly-shipping
consumer: { party: spokes, display_name: "Spokes (bike shop)", workspace: demo/spokes }
provider: { party: parcelly, display_name: "Parcelly (courier)", workspace: demo/parcelly }
scope: >-
  When an order is paid, Spokes creates a shipment at Parcelly; Parcelly sends every
  shipment status change back to Spokes by webhook, so the order shows the delivery status.
synthetic_allowlist:
  phones:
    - "07700 900200"
    - "+447700900200"
    - "0044 7700-900200"
    - "+447700900300"
    - "+447700900201"
    - "+447700900202"
    - "+447700900203"
    - "+447700900204"
    - "+447700900205"
  emails: ["john.smith@example.com"]
autopilot_answers:
  - match: ["returned", "return"]
    answer: "yes"
  - match: ["needs_review", "manual review", "unparseable"]
    answer: "flag for manual review and do not ship"
  - match: ["idempotency", "Idempotency-Key"]
    answer: "yes, require the key for this partner"
  - match: ["round"]
    answer: "round up to a whole gram"
personas:
  consumer: "careful owner of an online bike shop"
  provider: "partner onboarding manager at a courier company"
